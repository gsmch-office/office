<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선한목자교회 사무국</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: 고정 머리줄(첫화면·검색·메뉴) → 진행 사업 띠 → 운영 현황판(3열 현황 + 4열 신청) → 문서·매뉴얼 카드 → 바닥글 */
:root{
  --bg:#FAF9F5; --surface:#FFFFFF; --sunk:#F4F3EE; --line:#DCD9D1; --line-2:#CFCBC1;
  --fg:#2C2A26; --fg-2:#55534E; --fg-3:#8A847A;
  --brand:#07913B; --brand-soft:#F1F8F3; --brand-ink:#056B2C;
  --violet:#3F5E9A; --violet-soft:#EDF2FA;
  --warn:#9A6414; --warn-soft:#FBF3E6; --crit:#B3382A; --crit-soft:#FDF3F0;
  --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --r:12px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.lucide,svg.i{width:16px;height:16px;stroke-width:1.75;flex-shrink:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top::before{content:"";display:block;height:3px;background:var(--brand)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.home{display:flex;align-items:center;gap:10px;white-space:nowrap}
.mark{width:32px;height:32px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
.mark img{height:20px;width:auto}
.home b{font-weight:600;font-size:15px;letter-spacing:-.2px}
.home small{display:block;font-size:11.5px;color:var(--fg-3);font-weight:400;line-height:1.2}
.search{flex:1;position:relative;min-width:0;max-width:560px}
.search label{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--bg);color:var(--fg-3)}
.search label:focus-within{border-color:var(--brand)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;color:var(--fg)}
.search kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-radius:4px;padding:0 5px;color:var(--fg-3)}
.nav{display:flex;gap:2px;margin-left:auto}
.nav button{padding:7px 11px;border-radius:7px;font-size:13px;color:var(--fg-2)}
.nav button:hover{background:var(--sunk);color:var(--fg)}
.nav button[aria-current="true"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:500}
.theme{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--fg-2);border:1px solid var(--line)}
.theme:hover{background:var(--sunk)}

/* search results */
.results{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:8px;max-height:min(70vh,520px);overflow:auto;box-shadow:0 12px 32px rgba(10,30,15,.14)}
.rgroup{padding:6px 8px 4px;font-size:12px;color:var(--fg-3);display:flex;align-items:center;gap:8px}
.rgroup::after{content:"";flex:1;height:1px;background:var(--line)}
.ritem{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:8px;text-align:left}
.ritem:hover{background:var(--sunk)}
.ritem .cat{font-size:11.5px;color:var(--fg-3);white-space:nowrap;min-width:64px}
.ritem .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .m{font-size:12px;color:var(--fg-2);white-space:nowrap}
.ritem.done .t{color:var(--fg-2)}
.rempty{padding:18px 10px;color:var(--fg-3);font-size:13px;text-align:center}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}

/* page head */
main{padding-block:22px 40px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.phead h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.4px;text-wrap:balance}
.phead p{margin:2px 0 0;color:var(--fg-2);font-size:13px}
.clock{text-align:right}
.clock .t{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-.5px;line-height:1.1}
.clock .d{font-size:12.5px;color:var(--fg-2);display:flex;align-items:center;gap:6px;justify-content:flex-end}
.live{width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.sample{font-size:11px;color:var(--fg-3);border:1px dashed var(--line-2);border-radius:4px;padding:1px 6px;margin-left:6px}

/* project band */
.proj{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:6px}
.chip{font-size:11.5px;font-weight:500;color:var(--brand-ink);background:var(--brand-soft);border-radius:999px;padding:3px 9px;white-space:nowrap}
.proj b{font-weight:600;font-size:14.5px;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.steps i{height:6px;border-radius:3px;background:var(--line-2)}
.steps i.on{background:var(--brand)}
.steps i.now{background:repeating-linear-gradient(90deg,var(--brand) 0 6px,var(--brand-soft) 6px 9px)}
.proj .meta{font-size:12.5px;color:var(--fg-2);white-space:nowrap}
.proj .meta .num{color:var(--fg);font-weight:500;margin-left:6px}

/* sections */
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:12.5px;font-weight:500;color:var(--fg-2);letter-spacing:.2px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec .cnt{font-family:var(--mono);font-weight:500;color:var(--fg-3)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

/* stat card */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;text-align:left;display:flex;flex-direction:column;width:100%;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--line-2);transform:translateY(-1px)}
.card[data-s="warn"]{box-shadow:inset 3px 0 0 var(--warn)}
.card[data-s="crit"]{box-shadow:inset 3px 0 0 var(--crit)}
.ch{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg-2);font-weight:500}
.ch .go{margin-left:auto;color:var(--fg-3);opacity:0;transition:opacity .15s}
.card:hover .go{opacity:1}
.pill{font-size:11px;font-weight:500;border-radius:999px;padding:1px 8px;margin-left:auto}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill+.go{margin-left:6px}
.big{display:flex;align-items:baseline;gap:6px;margin:6px 0 2px}
.big .n{font-family:var(--mono);font-size:32px;font-weight:500;letter-spacing:-1px;line-height:1.1}
.g4 .big .n{font-size:26px}
.big .u{font-size:13px;color:var(--fg-2)}
.list{list-style:none;margin:10px 0 0;padding:8px 0 0;border-top:1px solid var(--line);display:grid;gap:3px}
.list li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;line-height:1.6}
.list li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li span:last-child{color:var(--fg-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.list li.warn span{color:var(--warn)}
.list li.crit span{color:var(--crit);font-weight:500}
.more{font-size:11.5px;color:var(--fg-3);margin-top:4px}
.legend{display:flex;gap:16px;justify-content:flex-end;font-size:12px;color:var(--fg-3);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:3px;height:12px;border-radius:2px;background:var(--line-2)}

/* docs */
.dhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.3px}
.dhead p{margin:0;font-size:12.5px;color:var(--fg-3)}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;transition:border-color .15s}
.doc:hover{border-color:var(--line-2)}
.dt{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.ico.g{background:var(--brand-soft);color:var(--brand-ink)}
.ico.v{background:var(--violet-soft);color:var(--violet)}
.dd{font-size:12.5px;color:var(--fg-2);line-height:1.6}
.df{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--fg-3);margin-top:auto;padding-top:6px}
.soon{border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;color:var(--fg-3)}
.ext{color:var(--brand-ink);font-weight:500}

footer{border-top:1px solid var(--line);margin-top:36px;padding-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--fg-3)}

/* 준비 중 view */
.prep{min-height:52vh;display:grid;place-items:center;text-align:center}
.prep h2{margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:-.4px}
.prep p{margin:0 0 20px;color:var(--fg-2)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:9px;padding:9px 16px;background:var(--surface);font-weight:500}
.btn:hover{border-color:var(--brand);color:var(--brand-ink)}


/* 흰 배경 강조 버전 */
.top{box-shadow:0 1px 0 var(--line)}
.phead h1{font-size:26px;font-weight:600}
.sec{font-size:15px;font-weight:600;color:var(--fg);margin:28px 0 12px;letter-spacing:-.2px;background:#EEF2EE;border-left:4px solid var(--brand-ink);border-radius:0 8px 8px 0;padding:9px 14px}
.sec::after{display:none}
.card{border:1px solid var(--line-2);padding:0;overflow:hidden}
.card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 6px 18px rgba(44,42,38,.08)}
.ch{background:#FBFAF7;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--fg)}
.ch svg.lucide:first-child{color:var(--brand)}
.big{padding:12px 16px 0;margin:0}
.big .n{font-size:40px;font-weight:600;color:var(--fg)}
.g4 .big .n{font-size:32px}
.big .u{font-size:14px;font-weight:500}
.list{margin:12px 16px 0;padding:10px 0 12px}
.list li{font-size:13.5px}
.more{padding:0 16px 10px;margin:-6px 0 0}
.card[data-s="warn"]{box-shadow:none;border-color:#E6CC9E}
.card[data-s="warn"] .ch{background:var(--warn-soft);border-bottom-color:#F1E0C2}
.card[data-s="warn"] .big .n{color:var(--warn)}
.card[data-s="crit"]{box-shadow:none;border-color:#E4A79E}
.card[data-s="crit"] .ch{background:var(--crit-soft);border-bottom-color:#F4D3CD}
.card[data-s="crit"] .big .n{color:var(--crit)}
.pill{font-size:11.5px;font-weight:600;padding:2px 9px}
.pill.warn{background:var(--warn);color:#fff}
.pill.crit{background:var(--crit);color:#fff}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line-2);background:var(--sunk)}
.proj{border:1px solid var(--brand);background:var(--brand-soft);padding:14px 18px}
.proj b{font-size:15.5px}
.steps i{height:8px;background:#fff;border:1px solid var(--line-2)}
.steps i.on{background:var(--brand);border-color:var(--brand)}
.steps i.now{border-color:var(--brand)}
.dhead h2{font-size:19px}
.doc{border:1px solid var(--line-2)}
.doc:hover{border-color:var(--brand);box-shadow:0 6px 18px rgba(44,42,38,.06)}
.dt{font-size:14.5px}

/* 굵고 또렷한 글자 */
body{font-size:15px;font-weight:500;letter-spacing:-.2px}
.home b{font-weight:800;font-size:16px}
.phead h1{font-weight:800;font-size:28px;letter-spacing:-.8px}
.phead p{font-weight:500}
.clock .t{font-weight:700;font-size:24px}
.sec{font-weight:800;font-size:16px}
.ch{font-weight:700;font-size:14.5px}
.big .n{font-weight:800;letter-spacing:-1.5px}
.big .u{font-weight:600;font-size:14.5px;color:var(--fg-2)}
.list li{font-size:14px;font-weight:500}
.list li span:last-child{font-weight:600}
.list li.crit span{font-weight:700}
.proj b{font-weight:800;font-size:16px}
.proj .meta{font-weight:500}.proj .meta .num{font-weight:800}
.chip{font-weight:700}
.dhead h2{font-weight:800;font-size:20px}
.dt{font-weight:700;font-size:15px}
.dd{font-weight:500;font-size:13.5px}
.nav button{font-weight:600;font-size:14px}
.search input{font-weight:500}
.ritem .t{font-weight:600}
.prep h2{font-weight:800;font-size:28px}

/* 문서·매뉴얼 색 입히기 */
#gridDocs .doc{background:var(--brand-soft);border-color:#BFDCC8}
#gridDocs .doc:hover{border-color:var(--brand)}
#gridMan .doc{background:var(--violet-soft);border-color:#C6D3EC}
#gridMan .doc:hover{border-color:var(--violet)}
.ico.g{background:var(--brand);color:#fff}
.ico.v{background:var(--violet);color:#fff}
.ico{width:34px;height:34px;border-radius:9px}
.ico svg.lucide{width:18px;height:18px}
#gridDocs .dt{color:var(--brand-ink)}
#gridMan .dt{color:#2C4677}
#gridDocs .soon{background:#fff;border-color:#BFDCC8;color:var(--brand-ink);font-weight:600}
#gridMan .soon{background:#fff;border-color:#C6D3EC;color:#2C4677;font-weight:600}
#gridDocs .df,#gridMan .df{color:var(--fg-2);font-weight:500}
.dhead{border-bottom:0;background:#EEF2EE;border-left:4px solid var(--brand-ink);border-radius:0 8px 8px 0;padding:10px 14px;align-items:center}
#manual.dhead{background:#EDF1F8;border-left-color:#2C4677}
#docs.dhead h2{color:var(--brand-ink)}
#manual.dhead h2{color:#2C4677}
.dhead h2{font-size:17px}

/* 미확인 알림 창 */
.alert{display:flex;align-items:center;gap:14px;background:var(--crit-soft);border:1px solid #E4A79E;border-radius:10px;padding:12px 18px;margin-bottom:12px}
.alert>svg.lucide{width:22px;height:22px;color:var(--crit)}
.abody{flex:1;min-width:0}
.atitle{font-weight:800;font-size:17px;color:var(--crit);display:flex;align-items:center;gap:8px}
.atag{font-size:11px;font-weight:600;color:var(--fg-3);border:1px dashed var(--line-2);border-radius:4px;padding:0 6px;background:#fff}
.asub{font-size:14px;font-weight:500;color:var(--crit);margin-top:2px}
@media (prefers-reduced-motion:no-preference){.alert{animation:flash 1.2s ease-in-out infinite}@keyframes flash{0%,100%{background:var(--crit-soft);box-shadow:0 0 0 0 rgba(179,56,42,0)}50%{background:#F8CFC8;box-shadow:0 0 0 6px rgba(179,56,42,.18)}}}
/* 시설·자산 현황 강조 패널 */
.hero{margin-top:22px;background:linear-gradient(var(--brand-soft),var(--brand-soft));border:2px solid var(--brand);border-radius:16px;padding:18px 18px 20px}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hhead h2{margin:0;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;color:var(--brand-ink);letter-spacing:-.6px}
.hhead h2 svg.lucide{width:26px;height:26px;color:#fff;background:var(--brand);border-radius:8px;padding:5px;box-sizing:content-box}
.hsum{display:flex;gap:6px;flex-wrap:wrap}
.hsum span{font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px;background:#fff;border:1px solid var(--line-2);color:var(--fg-2)}
.hsum .c{background:var(--crit);border-color:var(--crit);color:#fff}
.hsum .w{background:var(--warn);border-color:var(--warn);color:#fff}
.hero .g3{gap:12px}
.hero .card{border-width:1.5px}
.hero .big .n{font-size:46px}
.hero .ch{font-size:15.5px;padding:12px 16px}
.hero .list li{font-size:14.5px}
@media (max-width:620px){.hero{padding:14px}.hero .big .n{font-size:38px}}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.nav{display:none}}
@media (max-width:620px){
  .g3,.g4{grid-template-columns:1fr}
  .home small{display:none}.home b{display:none}
  .search kbd{display:none}
  .proj{grid-template-columns:auto 1fr;gap:10px}.steps{grid-column:1/-1}.proj .meta{grid-column:1/-1}
  .clock .t{font-size:18px}
}

/* 화면 크기별 자동 확대 (PC → 큰 모니터 → TV) */
@media (min-width:1440px){body{zoom:1.1}}
@media (min-width:1680px){body{zoom:1.25}}
@media (min-width:1920px){body{zoom:1.4}}
@media (min-width:2560px){body{zoom:1.85}}
@media (min-width:3200px){body{zoom:2.3}}
/* 태블릿·휴대폰은 글자를 살짝 키워 읽기 쉽게 */
@media (max-width:620px){body{font-size:15.5px}.list li{font-size:14.5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<header class="top">

 {t:'월간 운영 보고',d:'시설·차량·영선 처리 실적과 다음 달 주요 일정',ic:'clipboard-list',f:'월보고'},
 {t:'1층 성전보수',d:'로뎀카페·선지서점 설계부터 오픈까지 진도표와 도면',ic:'building-2',f:'오픈 11.1',url:'https://ezerahn.github.io/gsmch-mission/gsmch-1f.html'},
 {t:'시설 교체 이력',d:'주요 설비의 설치일, 내용연수, 교체·수리 기록',ic:'history',f:'시설'},
 {t:'계약·보험 현황',d:'용역·임대·보험 계약의 기간과 갱신 일정',ic:'file-badge',f:'계약'},
 {t:'양식 모음',d:'협조전, 지출결의서, 장소·차량·대여 신청서',ic:'files',f:'양식'}
];
const MAN=[
 {t:'사무국 업무 매뉴얼',d:'부서 역할과 업무 분장, 결재선과 금액별 집행 기준',ic:'book-open',f:'총론'},
 {t:'차량 운행·관리',d:'차량 신청 절차, 운행일지 작성, 정비·보험 처리 기준',ic:'bus',f:'차량'},
 {t:'시설 관리·영선 처리',d:'영선 접수부터 업체 배정, 완료 확인까지의 흐름',ic:'hammer',f:'영선'},
 {t:'장소 사용 안내',d:'장소별 수용 인원, 예약 방법, 사용 후 정리 기준',ic:'map-pin',f:'장소'},
 {t:'자산·비품 관리',d:'자산 등록·불용 처리 기준과 비품 대여·반납 규정',ic:'package',f:'자산'},
 {t:'사택 운영 기준',d:'입주·퇴거 절차, 관리비 부담 기준, 수리 요청 방법',ic:'house',f:'사택'}
];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const worst=it=>it.some(x=>x.s==='crit')?'crit':it.some(x=>x.s==='warn')?'warn':'';
function card(c){
  const s=worst(c.items);
  const pill=s?`<span class="pill ${s}">${s==='crit'?'긴급':'주의'}</span>`:'';
  const shown=c.items.slice(0,3), rest=c.items.length-3;
  return `<button class="card" data-s="${s}" data-open="${esc(c.k)}">
    <div class="ch"><svg class="i" data-lucide="${c.ic}"></svg>${esc(c.k)}${pill}<svg class="i go" data-lucide="arrow-up-right"></svg></div>
    <div class="big"><span class="n">${esc(c.n)}</span><span class="u">${esc(c.u)}</span></div>
    <ul class="list">${shown.map(x=>`<li class="${x.s||''}"><span>${esc(x.t)}</span><span>${esc(x.r)}</span></li>`).join('')}</ul>
    ${rest>0?`<div class="more">외 ${rest}건</div>`:''}
  </button>`;
}
function doc(d,tone){
  const foot=d.url?`<span>${esc(d.f)}</span><span class="ext">바로가기 ↗</span>`:`<span>${esc(d.f)}</span><span class="soon">준비 중</span>`;
  const tag=d.url?'a':'button';
  const attr=d.url?`href="${d.url}" target="_blank" rel="noopener"`:`data-open="${esc(d.t)}"`;
  return `<${tag} class="doc" ${attr}><div class="dt"><span class="ico ${tone}"><svg class="i" data-lucide="${d.ic}"></svg></span>${esc(d.t)}</div><div class="dd">${esc(d.d)}</div><div class="df">${foot}</div></${tag}>`;
}
$('#gridA').innerHTML=CARDS.filter(c=>c.g==='A').map(card).join('');
$('#gridB').innerHTML=CARDS.filter(c=>c.g==='B').map(card).join('');
$('#gridDocs').innerHTML=DOCS.map(d=>doc(d,'g')).join('');
$('#gridMan').innerHTML=MAN.map(d=>doc(d,'v')).join('');

/* views */
function openPrep(name){$('#prepName').textContent=name;$('#mainView').hidden=true;$('#prepView').hidden=false;closeRes();scrollTo(0,0)}
function goHome(){$('#prepView').hidden=true;$('#mainView').hidden=false;scrollTo(0,0)}
document.addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o){openPrep(o.dataset.open)}});
$('#homeBtn').onclick=goHome;$('#backBtn').onclick=goHome;
document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{
  goHome();document.querySelectorAll('[data-jump]').forEach(x=>x.setAttribute('aria-current',x===b));
  const el=document.getElementById(b.dataset.jump);const y=el.getBoundingClientRect().top+scrollY-80;scrollTo({top:b.dataset.jump==='board'?0:y,behavior:'smooth'})});

/* search: 진행 중 / 완료 */
const INDEX=[];
CARDS.forEach(c=>{c.items.forEach(x=>INDEX.push({cat:c.k,t:x.t,m:x.r,s:x.s,done:false}));c.done.forEach(x=>INDEX.push({cat:c.k,t:x.t,m:x.r,done:true}))});
DOCS.forEach(d=>INDEX.push({cat:'문서',t:d.t,m:d.url?'바로가기':'준비 중',body:d.d,done:false,url:d.url}));
MAN.forEach(d=>INDEX.push({cat:'매뉴얼',t:d.t,m:'준비 중',body:d.d,done:false}));
const hl=(s,q)=>esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);
function closeRes(){$('#results').hidden=true}
function search(q){
  q=q.trim();const box=$('#results');if(!q){box.hidden=true;return}
  const ql=q.toLowerCase();
  const hit=INDEX.filter(x=>(x.t+' '+x.cat+' '+(x.body||'')).toLowerCase().includes(ql));
  const on=hit.filter(x=>!x.done),off=hit.filter(x=>x.done);
  const row=x=>`<${x.url?'a':'button'} class="ritem${x.done?' done':''}" ${x.url?`href="${x.url}" target="_blank" rel="noopener"`:`data-open="${esc(x.cat+' · '+x.t)}"`}><span class="cat">${esc(x.cat)}</span><span class="t">${hl(x.t,q)}</span><span class="m" style="${x.s==='crit'?'color:var(--crit)':x.s==='warn'?'color:var(--warn)':''}">${esc(x.done?'완료 · '+x.m:x.m)}</span></${x.url?'a':'button'}>`;
  box.innerHTML=hit.length?`<div class="rgroup">진행 중 · ${on.length}건</div>${on.map(row).join('')||'<div class="rempty">진행 중인 항목이 없습니다</div>'}<div class="rgroup">완료 · ${off.length}건</div>${off.map(row).join('')||'<div class="rempty">완료된 항목이 없습니다</div>'}`:`<div class="rempty">"${esc(q)}" 검색 결과가 없습니다</div>`;
  box.hidden=false;
}
$('#q').addEventListener('input',e=>search(e.target.value));
$('#q').addEventListener('focus',e=>search(e.target.value));
document.addEventListener('click',e=>{if(!e.target.closest('.search'))closeRes()});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus()}
  if(e.key==='Escape'){closeRes();$('#q').blur()}});

/* clock */
const W=['일','월','화','수','목','금','토'];
function tick(){const d=new Date();$('#clockT').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  $('#clockD').textContent=`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}. (${W[d.getDay()]})`}
tick();setInterval(tick,15000);



/* 요약 칩 + 미확인 확인 */
(function(){const A=CARDS.filter(c=>c.g==='A');let c=0,w=0;A.forEach(x=>x.items.forEach(i=>{if(i.s==='crit')c++;if(i.s==='warn')w++}));
 $('#hsum').innerHTML=(c?`<span class="c">긴급 ${c}</span>`:'')+(w?`<span class="w">주의 ${w}</span>`:'')+`<span>전체 ${A.length}개 항목</span>`;
})();
if(window.lucide)lucide.createIcons();
</script>
