<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사무국 물품 대여장 · 선한목자교회 사무국</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f2f4f8; --surface:#ffffff; --fg:#1b2333; --muted:#5f6a7d; --line:#dbe0ea; --head:#f7f8fb;
  --accent:#2c4a8a; --accent-fg:#ffffff; --accent-soft:#e6ecf8; --band:#1f3566; --band-fg:#eef2fb; --band-muted:#aebbd8;
  --warn:#b8690f; --warn-soft:#fdf0dc; --bad:#c0392b; --bad-soft:#fbe5e2; --good:#2f7d5b; --good-soft:#e2f2ea; --wait:#6a4fb3; --wait-soft:#efeafb;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto}
.band{background:var(--band);color:var(--band-fg);padding-block:18px 20px}
.band .in{display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px}
.top a{color:var(--band-muted);font-size:13px;text-decoration:none}
h1{font-size:23px;font-weight:700;margin:0}
.status{color:var(--muted);font-size:12.5px}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 14px;display:grid;gap:2px}
.sum b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.sum span{font-size:13px;color:var(--band-muted)}
.sum .late b{color:#ff9d92} .sum .soon b{color:#ffc978} .sum .wait b{color:#c9b8ff}
.body{padding-block:18px 40px}
.banner{background:var(--warn-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.main{display:grid;gap:14px}
.view-apply .admin-only,.view-admin .apply-only,.view-apply .nav{display:none!important}
.apply-wrap{max-width:560px;width:100%;margin:0 auto;display:grid;gap:12px}
.apply-wrap .note{font-size:13px;color:var(--muted);text-align:center}
.nav{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:9px;padding:3px}
.nav a{color:var(--band-muted);text-decoration:none;font-size:14px;padding:5px 12px;border-radius:6px}
.nav a[aria-current="page"]{background:var(--band-fg);color:var(--band);font-weight:600}
.done-box{background:var(--good-soft);color:var(--good);border-radius:10px;padding:14px;text-align:center;font-weight:600}
form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
h2{font-size:16px;margin:0;font-weight:600}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:40px;width:100%;min-width:0}
textarea{height:auto;padding:8px 10px;resize:vertical}
input[type=date]{padding:0 8px;font-size:14px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px}
.mode button{font:inherit;font-size:14px;border:0;background:none;color:var(--muted);padding:6px;border-radius:6px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:2px 10px;cursor:pointer}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;height:42px;cursor:pointer;background:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;min-height:1em}
.sub{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:-6px}
.items{display:grid;gap:6px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 80px 40px;gap:6px;align-items:center}
.irow .x{font:inherit;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;cursor:pointer}
.add{font:inherit;font-size:13px;justify-self:start;background:none;border:1px dashed var(--accent);color:var(--accent);border-radius:7px;padding:4px 10px;cursor:pointer}
.msg.ok{color:var(--good)} .msg.err{color:var(--bad)}
.who-box{background:var(--head);border:1px solid var(--line);border-radius:9px;padding:10px;display:grid;gap:8px}
.who-box .t{font-size:12px;color:var(--muted)}
.listhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.tabs button{font:inherit;font-size:14px;border:0;background:none;color:var(--muted);padding:5px 14px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.search{max-width:220px}
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tr{display:grid;grid-template-columns:minmax(0,1.4fr) 52px minmax(0,1.4fr) minmax(0,1fr) 92px 92px 96px 120px;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);font-size:14px}
.tr.th{border-top:0;background:var(--head);color:var(--muted);font-size:12px;font-weight:600;padding-block:9px}
.tr>*{min-width:0;overflow-wrap:anywhere}
.tr.late{box-shadow:inset 4px 0 var(--bad)} .tr.soon{box-shadow:inset 4px 0 var(--warn)} .tr.wait{box-shadow:inset 4px 0 var(--wait)}
.c-item{font-weight:600} .c-item span{display:block} .c-item .src{display:inline-block}
.src{display:inline-block;font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-top:2px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.date{font-variant-numeric:tabular-nums;font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.rep{background:var(--good-soft);color:var(--good)} .tr.rep{box-shadow:inset 4px 0 var(--good)}
.view{margin-bottom:12px}
[hidden]{display:none!important}
.rbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.rbox h2{margin:0}
.rfind{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.rfind .btn{padding:0 16px;height:40px}
.ritem{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px}
.ritem b{font-size:15px}
.ritem .meta{font-size:13px;color:var(--muted)}
.ritem .btn{height:38px}
.ritem .pill{justify-self:start}
.pill.late{background:var(--bad-soft);color:var(--bad)} .pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--accent-soft);color:var(--accent)} .pill.done{background:var(--good-soft);color:var(--good)} .pill.wait{background:var(--wait-soft);color:var(--wait)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.ghost{font:inherit;font-size:12.5px;background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.ghost.ok{border-color:var(--accent);color:var(--accent);font-weight:600}
.ghost.del{color:var(--bad)}
.k{display:none}
.memo{grid-column:1/-1;font-size:13px;color:var(--muted);background:var(--head);border-radius:6px;padding:5px 9px;margin-top:-2px}
.edit{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--accent-soft);border-radius:8px;padding:8px}
.edit input{flex:1 1 220px;height:34px;font-size:14px;background:var(--surface)}
.rq{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13.5px}
.rq .rqi{display:flex;align-items:center;gap:4px;white-space:nowrap}
.edit .rq input[type=number]{flex:0 0 64px;width:64px;height:32px}
.edit .rq input[type=checkbox]{flex:none;width:16px;height:16px}
.staff{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end}
.staff .row2{flex:1 1 320px;max-width:420px}
.staff .t{flex:1 1 220px}
.staff .t{font-size:12.5px;color:var(--muted)}
.side{display:grid;align-content:start}
.empty{padding:26px;color:var(--muted);text-align:center;font-size:14px;border-top:1px solid var(--line)}
@media (max-width:980px){
  .tr.th{display:none}
  .tr{grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 14px}
  .tr>.c-item{grid-column:1/-1;font-size:16px}
  .tr>.c-stat{grid-column:1/-1;order:-1}
  .tr>.acts{grid-column:1/-1;justify-content:flex-start;margin-top:4px}
  .k{display:block;font-size:12px;color:var(--muted)}
  .num{text-align:left}
}
</style>
</head>
<body>
<div class="band gut"><div class="in">
  <div class="top"><h1 id="pageTitle">물품 대여 신청</h1><nav class="nav" aria-label="화면"><a href="#apply" id="navApply">대여 신청</a><a href="#admin" id="navAdmin">대여 관리</a></nav></div>
  <section class="sum admin-only" aria-label="요약">
    <div><b id="nOut">–</b><span>대여 중</span></div>
    <div class="late"><b id="nLate">–</b><span>반납 지연</span></div>
    <div class="soon"><b id="nSoon">–</b><span>3일 내 반납</span></div>
    <div class="wait"><b id="nWait">–</b><span>예약</span></div>
  </section>
</div></div>

<div class="body gut"><div class="in">
  <div class="banner" id="banner" hidden></div>
  <div class="main">
    <div class="apply-wrap apply-only">
    <div class="mode view" role="group" aria-label="할 일"><button type="button" id="vApply" aria-pressed="true">대여 신청</button><button type="button" id="vReturn" aria-pressed="false">반납 신고</button></div>
    <div class="rbox" id="rbox" hidden>
      <h2>반납 신고</h2>
      <div style="font-size:13.5px;color:var(--muted)">물품을 사무국에 돌려놓았다면 여기서 신고해 주세요. 담당자가 확인하면 「반납 완료」로 바뀌어요.</div>
      <label for="rWho">대여자 이름 (신청할 때 쓴 이름)<div class="rfind"><input id="rWho" placeholder="예: 전별림 전도사"><button type="button" class="btn" id="rFind">내 대여 찾기</button></div></label>
      <label for="rNote">메모 (선택)<input id="rNote" placeholder="예: 사무실 앞 선반에 두었어요"></label>
      <div id="rList"></div>
      <div class="msg" id="msg3" role="status"></div>
    </div>
    <form id="f" autocomplete="off">
      <h2 id="fTitle">대여 신청</h2>
      <div class="mode" role="group" aria-label="등록 종류"><button type="button" id="mNow" aria-pressed="true">바로 대여</button><button type="button" id="mWait" aria-pressed="false">미리 예약</button></div>
      <div class="sub">물품 · 수량</div>
      <div class="items" id="items"></div>
      <datalist id="itemList"></datalist>
      <button type="button" class="add" id="addItem">+ 물품 추가</button>
      <div class="chips" id="chips"></div>
      <label for="use">용도<input id="use" required placeholder="예: 갈렙교회 행사"></label>
      <div class="row2">
        <label for="who">대여자<input id="who" required placeholder="예: 전별림 전도사"></label>
        <label for="dept">대여 부서<input id="dept" required placeholder="예: 갈렙교회"></label>
      </div>
      <div class="row2">
        <label for="out"><span id="lOut">대여일</span><input id="out" type="date" required></label>
        <label for="due">반납 예정일<input id="due" type="date" required></label>
      </div>
      <button class="btn" id="save" type="submit">신청하기</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
    <div class="note">신청하면 사무국 대여 관리에 바로 올라가요. 물품은 사무국에서 받아 가세요.</div>
    </div>

    <div class="staff admin-only">
      <div class="t"><h2 style="margin-bottom:4px">담당자 확인</h2>반납 처리 · 비고 · 대여 시작 · 삭제는 담당자만 할 수 있어요.<br><span class="status" id="status">불러오는 중…</span></div>
      <div class="row2">
        <label for="author">담당자<select id="author"><option value="">선택</option></select></label>
        <label for="pin">비밀번호<input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="4자리"></label>
      </div>
      <div class="msg" id="msg2" role="status" style="flex-basis:100%"></div>
    </div>

    <section class="admin-only">
      <div class="listhead">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tOut" aria-selected="true">대여 중</button>
          <button type="button" role="tab" id="tWait" aria-selected="false">예약</button>
          <button type="button" role="tab" id="tDone" aria-selected="false">반납 완료</button>
        </div>
        <input class="search" id="q" type="search" placeholder="물품·대여자 검색">
      </div>
      <div class="ledger">
        <div class="tr th"><span>물품명</span><span style="text-align:right">수량</span><span>용도</span><span>대여자 · 부서</span><span id="hOut">대여일</span><span id="hDue">반납 예정일</span><span>상태</span><span></span></div>
        <div id="list"><div class="empty">불러오는 중…</div></div>
      </div>
    </section>
  </div>
</div></div>

<script>
const API="https://script.google.com/macros/s/AKfycbyxB7SpEN--KIUyncSBNlPCivRB2EUMU3-zTha-ZP1hG7blk-mDcOrZ1I8yZtA-vuXh/exec";
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY=ymd(new Date()), W="일월화수목금토";
const nice=s=>{if(!s)return"—";const d=new Date(s+"T00:00");if(isNaN(d))return s;return pad(d.getMonth()+1)+"."+pad(d.getDate())+" ("+W[d.getDay()]+")"};
const days=(a,b)=>Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5);
const load=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, store=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
$("out").value=TODAY;

let rows=[],tab="out",mode="now",confirmId=null,editId=null,editKind="",busy=false;
const parse=t=>String(t||"").split(/\n|,/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)[\s:x×]*(\d+)\s*(개|장|박스|ea)?$/i);return m&&m[1].trim()?{item:m[1].trim(),qty:+m[2]}:{item:x,qty:1}});
const total=r=>parse(r.items).reduce((a,i)=>a+i.qty,0);
/* 부분반납 (2026.11.08): 「반납 기록」으로 남은 수량 계산 */
const usedOf=log=>{const u={};String(log||"").split("\n").forEach(l=>{const m=l.match(/^\d{4}-\d{2}-\d{2} (반납|분실·파손) (.+?) \(.*\)$/);if(m)m[2].split(", ").forEach(p=>{const k=p.match(/^(.*) (\d+)$/);if(k)u[k[1]]=(u[k[1]]||0)+ +k[2]})});return u};
const remain=r=>{const u=usedOf(r.rlog);return parse(r.items).map(i=>{const x=Math.min(i.qty,u[i.item]||0);u[i.item]=(u[i.item]||0)-x;return{item:i.item,qty:i.qty-x}})};
const left=r=>remain(r).reduce((a,i)=>a+i.qty,0);
const partial=r=>!!r.rlog&&r.status!=="반납 완료";

function setMode(m){mode=m;$("mNow").setAttribute("aria-pressed",m==="now");$("mWait").setAttribute("aria-pressed",m==="wait");
  $("fTitle").textContent=m==="now"?"대여 신청":"예약 신청";$("lOut").textContent=m==="now"?"대여일":"대여일";$("save").textContent=m==="now"?"신청하기":"예약하기";if(m==="wait"&&$("out").value<=TODAY){const d=new Date();d.setDate(d.getDate()+1);$("out").value=ymd(d)}}
$("mNow").onclick=()=>setMode("now");$("mWait").onclick=()=>setMode("wait");

function chips(){const set=new Set(["테이블보","볼펜"]);rows.forEach(r=>parse(r.items).forEach(i=>set.add(i.item)));
  const box=$("chips");box.textContent="";[...set].slice(0,8).forEach(t=>{const b=el("button","chip",t);b.type="button";
  b.onclick=()=>{let ins=[...document.querySelectorAll(".irow .nm")];let tg=ins.find(i=>!i.value.trim());if(!tg)tg=addRow();tg.value=t;tg.parentNode.querySelector(".qt").focus()};box.append(b)});
  const dl=$("itemList");dl.textContent="";[...set].forEach(t=>{const o=document.createElement("option");o.value=t;dl.append(o)})}
let rowN=0;
function addRow(){const n=++rowN,d=el("div","irow");
  const a=document.createElement("input");a.className="nm";a.id="nm"+n;a.placeholder="물품 입력";a.setAttribute("aria-label","물품");
  const b=document.createElement("input");b.className="qt";b.id="qt"+n;b.type="number";b.min="1";b.value="1";b.setAttribute("aria-label","수량");
  const x=btn("×","x",()=>{if(document.querySelectorAll(".irow").length>1)d.remove();else{a.value="";b.value="1"}});x.setAttribute("aria-label","이 물품 빼기");
  d.append(a,b,x);$("items").append(d);return a}
function resetItems(){$("items").textContent="";addRow()}
function itemsText(){return [...document.querySelectorAll(".irow")].map(r=>({n:r.querySelector(".nm").value.trim(),q:Math.max(1,parseInt(r.querySelector(".qt").value)||1)})).filter(i=>i.n).map(i=>i.n+" "+i.q).join("\n")}

function status(r){
  if(r.status==="반납 신고")return{cls:"rep",txt:"반납 신고"+(r.returned?" "+r.returned.slice(5).replace("-","."):"")};
  if(r.status==="반납 완료")return{cls:"done",txt:"반납 완료"};
  if(r.status==="대기"){if(!r.out)return{cls:"wait",txt:"예약"};const d=days(TODAY,r.out);return{cls:"wait",txt:d>0?"수령 D-"+d:d===0?"오늘 수령":"수령일 "+(-d)+"일 지남"}}
  if(!r.due)return{cls:"ok",txt:"대여 중"};
  const d=days(TODAY,r.due);
  if(d<0)return{cls:"late",txt:(-d)+"일 지연"};
  if(d===0)return{cls:"soon",txt:"오늘 반납"};
  return{cls:d<=3?"soon":"ok",txt:"D-"+d};
}
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function cell(c,k,v){const s=el("div",c);s.append(el("span","k",k),document.createTextNode(v));return s}
function btn(t,c,f){const b=el("button",c,t);b.type="button";b.onclick=f;return b}

function render(){
  const outs=rows.filter(r=>r.status==="대여 중"), reps=rows.filter(r=>r.status==="반납 신고"), waits=rows.filter(r=>r.status==="대기");
  $("nOut").textContent=outs.reduce((s,r)=>s+left(r),0);
  $("nLate").textContent=outs.filter(r=>r.due&&r.due<TODAY).length;
  $("nSoon").textContent=outs.filter(r=>r.due&&r.due>=TODAY&&days(TODAY,r.due)<=3).length;
  $("nWait").textContent=waits.length;
  $("hOut").textContent=tab==="wait"?"대여일":"대여일";$("hDue").textContent=tab==="done"?"반납일":"반납 예정일";
  const q=$("q").value.trim();
  let list=tab==="out"?reps.concat(outs):tab==="wait"?waits:rows.filter(r=>r.status==="반납 완료");
  if(q)list=list.filter(r=>[r.items,r.who,r.use,r.dept].join(" ").includes(q));
  list=list.slice().sort(tab==="done"?(a,b)=>(b.returned||"").localeCompare(a.returned||""):tab==="wait"?(a,b)=>(a.out||"").localeCompare(b.out||""):(a,b)=>(a.due||"9").localeCompare(b.due||"9"));
  const box=$("list");box.textContent="";
  if(!list.length){box.append(el("div","empty",q?"검색 결과가 없습니다.":tab==="out"?"대여 중인 물품이 없습니다.":tab==="wait"?"예약된 신청이 없습니다.":"반납 완료된 기록이 없습니다."));return}
  for(const r of list){
    const st=status(r),pt=partial(r),its=pt?remain(r).filter(i=>i.qty>0):parse(r.items);
    const row=el("div","tr"+(["late","soon","wait","rep"].includes(st.cls)?" "+st.cls:""));
    const ci=el("div","c-item");its.forEach(i=>ci.append(el("span","",i.item+(pt?" "+i.qty+"개 남음":its.length>1?" "+i.qty+"개":""))));if(r.source==="QR 신청")ci.append(el("span","src","QR 신청"));row.append(ci);
    row.append(cell("num","수량 ",pt?left(r)+"/"+total(r):String(total(r))));
    row.append(cell("","용도 ",r.use||"—"));
    row.append(cell("","대여자 ",(r.who||"—")+(r.dept?" · "+r.dept:"")));
    row.append(cell("date",tab==="wait"?"대여일 ":"대여일 ",nice(r.out)));
    row.append(cell("date",tab==="done"?"반납일 ":"반납 예정일 ",nice(tab==="done"?r.returned:r.due)));
    const s=el("div","c-stat");s.append(el("span","pill "+st.cls,st.txt));if(pt)s.append(el("span","pill wait","부분반납"));row.append(s);
    const a=el("div","acts");
    if(confirmId===r.id){a.append(btn("삭제 확인","ghost del",()=>act({action:"delete",id:r.id})),btn("취소","ghost",()=>{confirmId=null;render()}))}
    else{
      if(r.status==="대기")a.append(btn("가져감 (대여 시작)","ghost ok",()=>act({action:"status",id:r.id,status:"대여 중",startToday:true})));
      else if(r.status==="대여 중")a.append(btn("반납 처리","ghost ok",()=>openEdit(r.id,"return")));
      else if(r.status==="반납 신고")a.append(btn("반납 확인","ghost ok",()=>openEdit(r.id,"return")));
      else a.append(btn("대여 중으로","ghost",()=>act({action:"status",id:r.id,status:"대여 중"})));
      a.append(btn("비고","ghost",()=>openEdit(r.id,"note")));
      a.append(btn("삭제","ghost del",()=>{confirmId=r.id;render()}));
    }
    row.append(a);
    if(r.note||r.author||r.rlog){const m=el("div","memo");m.textContent=[r.rlog?"반납 기록: "+r.rlog.split("\n").map(l=>l.slice(5).replace("-",".")).join(" / "):"",r.note?"비고: "+r.note:"",r.author&&r.status==="반납 완료"?"회수 담당: "+r.author:"",r.status==="반납 신고"?"본인이 반납 신고함 → 물품 확인 후 [반납 확인]":""].filter(Boolean).join("  ·  ");if(m.textContent)row.append(m)}
    if(editId===r.id){const ed=el("div","edit");const inp=document.createElement("input");inp.id="noteIn";inp.value=r.note||"";inp.placeholder=editKind==="return"?"비고 (예: 2장 오염, 1장 덜 들어옴)":"비고 입력";
      if(editKind==="return"){const qs=[],g=el("div","rq");g.append(el("b","","돌려받은 수량"));
        remain(r).filter(i=>i.qty>0).forEach(i=>{const w=el("label","rqi"),n=document.createElement("input");n.type="number";n.min="0";n.max=String(i.qty);n.value=String(i.qty);n.setAttribute("aria-label",i.item+" 돌려받은 수량");qs.push([i.item,n]);w.append(document.createTextNode(i.item+" "),n,document.createTextNode(" / "+i.qty+"개"));g.append(w)});
        const lw=el("label","rqi"),lost=document.createElement("input");lost.type="checkbox";lw.append(lost,document.createTextNode(" 못 받은 나머지는 분실·파손으로 처리"));g.append(lw);ed.append(g);
        ed.append(inp,btn("반납 저장","ghost ok",()=>{const back=qs.map(([item,n])=>({item,qty:Math.max(0,Math.min(+n.max,parseInt(n.value)||0))}));if(!back.some(x=>x.qty>0)&&!lost.checked){say2(ERR.zero,false);return}act({action:"return",id:r.id,back,lost:lost.checked,note:inp.value.trim()})}),btn("취소","ghost",()=>{editId=null;render()}))}
      else ed.append(inp,btn("비고 저장","ghost ok",()=>act({action:"note",id:r.id,note:inp.value.trim()})),btn("취소","ghost",()=>{editId=null;render()}));
      row.append(ed);setTimeout(()=>inp.focus(),0)}
    box.append(row);
  }
}

function say(t,ok){const m=$("msg");m.textContent=t;m.className="msg "+(ok?"ok":"err")}
const ERR={pin:"담당자 또는 비밀번호가 맞지 않아요.",missing:"빈 칸을 모두 채워 주세요.",not_found:"이미 지워진 기록이에요. 새로고침했어요.",busy:"다른 분이 저장 중이에요. 잠시 후 다시 눌러 주세요.",zero:"돌려받은 수량을 넣어 주세요.",bad:"요청을 처리하지 못했어요."};
function openEdit(id,k){editId=id;editKind=k;confirmId=null;render()}
function say2(t,ok){const m=$("msg2");m.textContent=t;m.className="msg "+(ok?"ok":"err")}
function creds(){const author=$("author").value,pin=$("pin").value.trim();if(!author||pin.length!==4){say2("담당자와 비밀번호를 먼저 넣어 주세요.",false);$("author").scrollIntoView({block:"center"});$("author").focus();return null}store("rent-author",author);return{author,pin}}

async function apply(d){if(d&&d.entries){rows=d.entries;const s=$("author"),cur=s.value||load("rent-author")||"";s.textContent="";s.append(new Option("선택",""));(d.authors||[]).forEach(a=>s.append(new Option(a,a)));s.value=(d.authors||[]).includes(cur)?cur:"";chips();render();
  $("status").textContent="최신 · "+new Date().toTimeString().slice(0,5)+" 기준";$("banner").hidden=true}}
async function refresh(){try{const r=await fetch(API+"?t="+Date.now());const d=await r.json();if(!d.ok)throw 0;apply(d)}
  catch(e){$("status").textContent="연결 안 됨";const b=$("banner");b.hidden=false;b.textContent="대여장 저장소에 연결하지 못했어요. 잠시 후 새로고침해 주세요.";if(!rows.length)$("list").innerHTML='<div class="empty">불러오지 못했습니다.</div>'}}
async function post(body){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});return r.json()}
async function act(o){const c=creds();if(!c)return;if(busy)return;busy=true;confirmId=null;
  try{const d=await post({...o,...c});if(!d.ok){say2(ERR[d.error]||ERR.bad,false);if(d.error==="not_found")refresh()}else{editId=null;apply(d);say2("저장했습니다.",true)}}
  catch(e){say2("저장하지 못했어요. 인터넷 연결을 확인해 주세요.",false)}finally{busy=false}}

$("f").addEventListener("submit",async e=>{e.preventDefault();
  const data={kind:mode==="wait"?"대기":"바로 대여",items:itemsText(),use:$("use").value.trim(),who:$("who").value.trim(),dept:$("dept").value.trim(),out:$("out").value,due:$("due").value};
  if(!data.items||!data.use||!data.who||!data.dept||!data.out||!data.due){say(ERR.missing,false);return}
  $("save").disabled=true;
  try{const d=await post({action:"add",data});if(!d.ok){say(ERR[d.error]||ERR.bad,false)}else{apply(d);["use","who","dept","due"].forEach(k=>$(k).value="");resetItems();$("out").value=TODAY;say((data.kind==="대기"?"예약했습니다: ":"신청했습니다: ")+parse(data.items).map(i=>i.item+" "+i.qty+"개").join(", "),true);tab=data.kind==="대기"?"wait":"out";setTab()}}
  catch(err){say("저장하지 못했어요. 인터넷 연결을 확인해 주세요.",false)}finally{$("save").disabled=false}});
function setTab(){$("tOut").setAttribute("aria-selected",tab==="out");$("tWait").setAttribute("aria-selected",tab==="wait");$("tDone").setAttribute("aria-selected",tab==="done");render()}
$("tOut").onclick=()=>{tab="out";setTab()};$("tWait").onclick=()=>{tab="wait";setTab()};$("tDone").onclick=()=>{tab="done";setTab()};
$("q").addEventListener("input",render);
function setView(v){$("vApply").setAttribute("aria-pressed",v==="apply");$("vReturn").setAttribute("aria-pressed",v==="return");$("f").hidden=v!=="apply";$("rbox").hidden=v!=="return";if(v==="return"){const w=load("rent-me");if(w&&!$("rWho").value)$("rWho").value=w;if($("rWho").value)rFind();else $("rWho").focus()}}
$("vApply").onclick=()=>setView("apply");$("vReturn").onclick=()=>setView("return");
const norm=s=>String(s||"").replace(/\s+/g,"");
function say3(t,ok){const m=$("msg3");m.textContent=t;m.className="msg "+(ok?"ok":"err")}
function rFind(){const w=norm($("rWho").value);const box=$("rList");box.textContent="";say3("",true);
  if(w.length<2){say3("대여자 이름을 2글자 이상 넣어 주세요.",false);return}
  const mine=rows.filter(r=>(r.status==="대여 중"||r.status==="반납 신고")&&norm(r.who).includes(w));
  if(!mine.length){box.append(el("div","empty","이 이름으로 대여 중인 물품이 없어요. 신청할 때 쓴 이름을 확인해 주세요."));return}
  store("rent-me",$("rWho").value.trim());
  mine.sort((a,b)=>(a.due||"9").localeCompare(b.due||"9")).forEach(r=>{const st=status(r),d=el("div","ritem");
    d.append(el("span","pill "+st.cls,st.txt),el("b","",(partial(r)?remain(r).filter(i=>i.qty>0):parse(r.items)).map(i=>i.item+" "+i.qty+"개").join(", ")),el("div","meta",(r.use||"")+" · "+(r.who||"")+(r.dept?" ("+r.dept+")":"")+" · 대여 "+nice(r.out)+" ~ 반납 예정 "+nice(r.due)));
    if(r.status==="대여 중")d.append(btn("반납했어요","btn",()=>selfReturn(r.id)));
    else d.append(el("div","meta","신고 완료 · 담당자 확인을 기다리는 중"));
    box.append(d)})}
$("rFind").onclick=rFind;$("rWho").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();rFind()}});
async function selfReturn(id){if(busy)return;busy=true;say3("신고하는 중…",true);
  try{const d=await post({action:"selfReturn",id,who:$("rWho").value.trim(),note:$("rNote").value.trim()});
    if(!d.ok){say3(d.error==="who"?"대여자 이름이 신청 기록과 달라요.":ERR[d.error]||ERR.bad,false);if(d.error==="not_found")refresh()}
    else{busy=false;apply(d);$("rNote").value="";rFind();say3("반납 신고했어요. 담당자가 확인하면 반납 완료로 바뀌어요. 고맙습니다!",true)}}
  catch(e){say3("신고하지 못했어요. 인터넷 연결을 확인해 주세요.",false)}finally{busy=false}}
function route(){const v=location.hash==="#admin"?"admin":"apply";document.body.className="view-"+v;
  $("pageTitle").textContent=v==="admin"?"물품 대여 관리":"물품 대여 신청";document.title=(v==="admin"?"물품 대여 관리":"물품 대여 신청")+" · 선한목자교회 사무국";
  $("navApply").toggleAttribute("aria-current",v==="apply");$("navAdmin").toggleAttribute("aria-current",v==="admin");
  if(v==="apply")$("navApply").setAttribute("aria-current","page");else $("navAdmin").setAttribute("aria-current","page")}
window.addEventListener("hashchange",route);route();
resetItems();$("addItem").onclick=()=>addRow().focus();
chips();refresh();setInterval(()=>{if(!document.hidden&&!busy)refresh()},60000);
</script>
</body>
</html>
