<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>식수 변경 일정표 · 선한목자교회 사무국</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 주방 게시판 — 위 입력 띠, 가운데 달력, 아래 선택한 날 목록 · 이번 달 목록 */
:root{
  --bg:#F3F6F5; --panel:#FFFFFF; --ink:#18282A; --muted:#5E6E70; --line:#D7E0DE;
  --accent:#0F6B6B; --accent-ink:#FFFFFF; --soft:#E3EFEE;
  --add:#1E7A46; --add-bg:#E2F2E8; --cut:#B23A2E; --cut-bg:#F8E4E1; --sun:#C0392B; --sat:#2563A8;
  --today:#FFF4CC;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101818; --panel:#172222; --ink:#E4EEEC; --muted:#93A6A4; --line:#2A3A3A;
  --accent:#4FB3AE; --accent-ink:#0D1A1A; --soft:#1F3130;
  --add:#6CCB93; --add-bg:#18352A; --cut:#F08A7E; --cut-bg:#3A201D; --sun:#F08A7E; --sat:#7FB2EE; --today:#3A3420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101818; --panel:#172222; --ink:#E4EEEC; --muted:#93A6A4; --line:#2A3A3A;
  --accent:#4FB3AE; --accent-ink:#0D1A1A; --soft:#1F3130;
  --add:#6CCB93; --add-bg:#18352A; --cut:#F08A7E; --cut-bg:#3A201D; --sun:#F08A7E; --sat:#7FB2EE; --today:#3A3420; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.status{font-size:12.5px;color:var(--muted)}
.banner{background:var(--cut-bg);color:var(--cut);border-radius:10px;padding:10px 14px;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
/* form */
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none;width:1px}
.seg label{flex:1;display:block;text-align:center;padding:9px 6px;cursor:pointer;color:var(--ink);font-size:14px;font-weight:600;background:var(--bg)}
.seg label+input+label,.seg input+label~label{border-left:1px solid var(--line)}
.seg input:checked+label.add{background:var(--add);color:#fff}
.seg input:checked+label.cut{background:var(--cut);color:#fff}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-2px}
.wide{grid-column:span 2}
@media (max-width:520px){.wide{grid-column:1/-1}}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;font-weight:600}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:not-allowed}
.formmsg{grid-column:1/-1;font-size:13px;min-height:1.2em;color:var(--muted)}
.formmsg.err{color:var(--cut)}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.calhead h2{margin:0;font-size:20px;font-family:var(--f-num);font-weight:600;letter-spacing:-.01em}
.nav{display:flex;gap:6px}
.nav button{padding:6px 12px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dow{font-size:12px;font-weight:600;text-align:center;padding:6px 0;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft)}
.dow.sun{color:var(--sun)} .dow.sat{color:var(--sat)}
.cell{min-height:108px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:var(--panel);text-align:left;border-radius:0;font-weight:400;min-width:0}
.cell:hover{background:var(--soft)}
.cell.out{background:var(--bg);color:var(--muted)}
.cell.today{background:var(--today)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dn{font-family:var(--f-num);font-size:13px;font-weight:600}
.cell.sun .dn{color:var(--sun)} .cell.sat .dn{color:var(--sat)}
.chip{font-size:11.5px;line-height:1.35;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.chip.add{background:var(--add-bg);color:var(--add)} .chip.cut{background:var(--cut-bg);color:var(--cut)}
.more{font-size:11px;color:var(--muted)}
.dots{display:none;gap:3px;flex-wrap:wrap;font-size:11px;font-family:var(--f-num);font-weight:600}
.dots .a{color:var(--add)} .dots .c{color:var(--cut)}
@media (max-width:640px){.cell{min-height:58px;padding:4px}.chip,.more{display:none}.dots{display:flex}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .la::before{background:var(--add)} .legend .lc::before{background:var(--cut)}
/* lists */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px}
@media (max-width:800px){.two{grid-template-columns:minmax(0,1fr)}}
h3{margin:0 0 10px;font-size:16px}
.totals{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tot{background:var(--soft);border-radius:8px;padding:6px 10px;font-size:13px}
.tot b{font-family:var(--f-num)}
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.badge{font-family:var(--f-num);font-weight:600;font-size:14px;border-radius:6px;padding:3px 8px;min-width:58px;text-align:center}
.badge.add{background:var(--add-bg);color:var(--add)} .badge.cut{background:var(--cut-bg);color:var(--cut)}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .m{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.item button{padding:5px 9px;font-size:12.5px;font-weight:500}
.item button.confirm{background:var(--cut);border-color:var(--cut);color:#fff}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.memo{white-space:normal;min-width:120px;color:var(--muted)}
td.n{font-family:var(--f-num);font-weight:600}
td.n.add{color:var(--add)} td.n.cut{color:var(--cut)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
@media (prefers-reduced-motion:no-preference){.cell,.item{transition:background .15s}}
</style>
<style>:root{color-scheme:light}.wrap{zoom:var(--z,1)}@media (min-width:1000px){:root{--z:1.2}}.zoom{display:flex;gap:6px;align-items:center}.zoom button{padding:4px 10px;font-size:13px}body{margin:0}.back{font-size:13px;color:var(--muted);text-decoration:none}.back:hover{color:var(--accent)}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <a class="back" href="../">← 사무국 현황판</a>
      <h1>식수 변경 일정표</h1>
      <p class="sub">카톡 대신 여기에 적어 주세요 · 추가/제외가 바로 달력에 올라갑니다</p>
    </div>
    <div class="zoom"><div class="status" id="status">불러오는 중…</div><button type="button" id="zOut" aria-label="글자 작게">가−</button><button type="button" id="zIn" aria-label="글자 크게">가+</button></div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section class="panel" aria-labelledby="fh">
    <h3 id="fh">✏️ 식수 변경 입력</h3>
    <form id="f" autocomplete="off">
      <label><span>날짜 <b style="color:var(--cut)">*</b></span><input type="date" id="fDate" required></label>
      <label><span>식사 <b style="color:var(--cut)">*</b></span><select id="fMeal" required><option value="" selected disabled>선택</option><option>조식</option><option>중식</option><option>석식</option></select></label>
      <div><span style="font-size:12.5px;color:var(--muted);font-weight:500">구분 <b style="color:var(--cut)">*</b></span>
        <div class="seg" role="radiogroup" aria-label="구분" style="margin-top:4px">
          <input type="radio" name="kind" id="kAdd" value="추가" required><label class="add" for="kAdd">＋ 추가</label>
          <input type="radio" name="kind" id="kCut" value="제외"><label class="cut" for="kCut">－ 제외</label>
        </div>
      </div>
      <label><span>인원 <b style="color:var(--cut)">*</b></span><input type="number" id="fCount" min="1" max="999" inputmode="numeric" placeholder="예: 12" required></label>
      <label class="wide"><span>부서 · 위원회 <b style="color:var(--cut)">*</b></span><input id="fDept" placeholder="직접 입력 (필수) 예: 교통국" required></label>
      <label class="wide"><span>메모 (선택)</span><input id="fMemo" placeholder="예: 행사로 도시락 대체"></label>
      <label><span>작성자 <b style="color:var(--cut)">*</b></span><select id="fAuthor" required><option value="" selected disabled>선택</option></select></label>
      <label><span>비밀번호 <b style="color:var(--cut)">*</b></span><input type="password" id="fPin" inputmode="numeric" maxlength="4" placeholder="4자리" autocomplete="off" required></label>
      <button class="primary" id="fBtn" type="submit">일정표에 올리기</button>
      <button id="fCancel" type="button" hidden>수정 취소</button>
      <div class="formmsg" id="fMsg" role="status"></div>
    </form>
      </section>

  <section class="panel" aria-labelledby="mh">
    <div class="calhead">
      <h2 id="mh"></h2>
      <div class="nav">
        <button id="prev" type="button" aria-label="이전 달">◀</button>
        <button id="todayBtn" type="button">오늘</button>
        <button id="next" type="button" aria-label="다음 달">▶</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend"><span class="la">추가</span><span class="lc">제외</span><span>칸 표시: 식사 · 인원 · 부서 (날짜를 누르면 아래에 자세히) · 수정·삭제는 본인이 올린 것만 (작성자·비밀번호 먼저 입력)</span></div>
  </section>

  <div class="two">
    <section class="panel" aria-labelledby="dh">
      <h3 id="dh"></h3>
      <div class="totals" id="dTot"></div>
      <div class="items" id="dList"></div>
    </section>
    <section class="panel" aria-labelledby="lh">
      <h3 id="lh"></h3>
      <div class="tablewrap"><table>
        <thead><tr><th>날짜</th><th>식사</th><th>인원</th><th>부서</th><th>메모</th><th>작성</th></tr></thead>
        <tbody id="mList"></tbody>
      </table></div>
    </section>
  </div>
</div>

<script>
/* ▼ 앱스스크립트 웹앱 주소 (배포 후 여기에 넣기) */
const API="https://script.google.com/macros/s/AKfycbxDRVUWhFE6nRblUuora9ip5Jpvx-YHYFwbY3zhEKm_yvAOYjsjMLhY2Qune7r94-11/exec";
const DOW=["일","월","화","수","목","금","토"], MEALS=["조식","중식","석식"];
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=ymd(new Date());
let entries=[], authors=[], view=new Date(), sel=today, ready=false, editId=null, editOrig=null, dupKey="";
view.setDate(1);
const store=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const load=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const sstore=(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}};
const sload=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const norm=s=>String(s).replace(/\s+/g,"");
function fmtDay(s){const d=new Date(s+"T00:00:00");return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`}
const sign=e=>(e.kind==="제외"?"−":"+")+e.count, cls=e=>e.kind==="제외"?"cut":"add";
const byDate=s=>entries.filter(e=>e.date===s).sort((a,b)=>MEALS.indexOf(a.meal)-MEALS.indexOf(b.meal)||String(a.createdAt).localeCompare(String(b.createdAt)));
function el(t,a={},x){const n=document.createElement(t);for(const[k,v]of Object.entries(a))n.setAttribute(k,v);if(x!=null)n.textContent=x;return n}
const me=()=>$("fAuthor").value, isAdmin=()=>!!(authors.find(a=>a.name===me())||{}).admin;
const mine=e=>me()&&(e.author===me()||isAdmin());

/* ---- 서버 ---- */
async function apiGet(){const r=await fetch(API+"?action=list&t="+Date.now());return r.json()}
async function apiPost(body){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});return r.json()}
const ERR={pin:"작성자 또는 비밀번호가 맞지 않아요.",past:"지난 날짜는 입력할 수 없어요.",missing:"메모를 빼고 모두 넣어 주세요.",not_mine:"본인이 올린 것만 고칠 수 있어요.",not_found:"이미 지워진 내역이에요. 새로고침했어요.",busy:"다른 분이 저장 중이에요. 잠시 후 다시 눌러 주세요."};
async function refresh(){
  try{const d=await apiGet(); if(!d.ok)throw 0;
    entries=d.entries||[]; const prev=me();
    authors=(d.authors||[]).map(a=>typeof a==="string"?{name:a}:a);
    const s=$("fAuthor"); s.textContent=""; s.appendChild(el("option",{value:"",disabled:""},"선택"));
    authors.forEach(a=>s.appendChild(el("option",{},a.name)));
    const want=prev||load("ms-author")||""; s.value=authors.some(a=>a.name===want)?want:"";
    ready=true; $("banner").hidden=true; $("fBtn").disabled=false;
    $("status").textContent=`최신 · ${entries.length}건 · ${new Date().toTimeString().slice(0,5)} 기준`;
  }catch(e){$("status").textContent="연결 안 됨";const b=$("banner");b.hidden=false;b.textContent="저장소에 연결하지 못했어요. 잠시 후 새로고침해 주세요.";if(!ready)$("fBtn").disabled=true}
  render();
}

/* ---- 화면 ---- */
function renderCal(){
  const y=view.getFullYear(),m=view.getMonth(); $("mh").textContent=`${y}. ${pad(m+1)}`;
  const g=$("grid"); g.textContent="";
  DOW.forEach((d,i)=>g.appendChild(el("div",{class:"dow"+(i===0?" sun":i===6?" sat":"")},d)));
  const start=new Date(y,m,1); start.setDate(1-start.getDay());
  const cells=Math.ceil((new Date(y,m+1,0).getDate()+new Date(y,m,1).getDay())/7)*7;
  for(let i=0;i<cells;i++){
    const d=new Date(start); d.setDate(start.getDate()+i); const s=ymd(d);
    const c=el("button",{type:"button",class:"cell"+(d.getMonth()!==m?" out":"")+(s===today?" today":"")+(s===sel?" sel":"")+(d.getDay()===0?" sun":d.getDay()===6?" sat":""),"aria-label":fmtDay(s)});
    c.appendChild(el("span",{class:"dn"},d.getDate()));
    const list=byDate(s);
    list.slice(0,3).forEach(e=>c.appendChild(el("span",{class:"chip "+cls(e),title:`${e.meal} ${sign(e)} ${e.dept}`},`${e.meal[0]} ${sign(e)} ${e.dept}`)));
    if(list.length>3)c.appendChild(el("span",{class:"more"},`+${list.length-3}건 더`));
    if(list.length){const dots=el("span",{class:"dots"});
      const a=list.filter(e=>e.kind!=="제외").reduce((t,e)=>t+e.count,0),r=list.filter(e=>e.kind==="제외").reduce((t,e)=>t+e.count,0);
      if(a)dots.appendChild(el("span",{class:"a"},"+"+a)); if(r)dots.appendChild(el("span",{class:"c"},"−"+r)); c.appendChild(dots)}
    c.addEventListener("click",()=>{sel=s;if(!editId&&s>=today)$("fDate").value=s;render()});
    g.appendChild(c);
  }
}
function renderDay(){
  $("dh").textContent=`📌 ${fmtDay(sel)}`;
  const list=byDate(sel),tot=$("dTot"),box=$("dList"); tot.textContent=""; box.textContent="";
  MEALS.forEach(meal=>{const l=list.filter(e=>e.meal===meal); if(!l.length)return;
    const net=l.reduce((t,e)=>t+(e.kind==="제외"?-e.count:e.count),0);
    const t=el("span",{class:"tot"}); t.append(meal+" 합계 "); t.appendChild(el("b",{},(net>0?"+":net<0?"−":"±")+Math.abs(net)+"명")); tot.appendChild(t)});
  if(!list.length){box.appendChild(el("div",{class:"empty"},"이 날은 변경이 없어요. 위에서 입력하면 바로 올라와요."));return}
  list.forEach(e=>{
    const it=el("div",{class:"item"}); it.appendChild(el("span",{class:"badge "+cls(e)},sign(e)));
    const mid=el("div"); mid.appendChild(el("div",{class:"t"},`${e.meal} · ${e.dept}`));
    const meta=[e.memo,e.author&&("작성 "+e.author),e.updatedAt&&("수정 "+e.updatedAt)].filter(Boolean).join(" · ");
    if(meta)mid.appendChild(el("div",{class:"m"},meta)); it.appendChild(mid);
    if(mine(e)){const btns=el("div",{style:"display:flex;gap:6px"});
      const eb=el("button",{type:"button"},"수정"); eb.addEventListener("click",()=>startEdit(e)); btns.appendChild(eb);
      const b=el("button",{type:"button"},"삭제"); let armed=null;
      b.addEventListener("click",async()=>{
        if(!armed){b.textContent="정말 삭제";b.classList.add("confirm");armed=setTimeout(()=>{armed=null;b.textContent="삭제";b.classList.remove("confirm")},3000);return}
        clearTimeout(armed); const pin=$("fPin").value.trim(); const m=$("fMsg");
        if(!/^\d{4}$/.test(pin)){m.className="formmsg err";m.textContent="삭제하려면 위에 비밀번호 4자리를 먼저 넣어 주세요.";$("fPin").focus();b.textContent="삭제";b.classList.remove("confirm");armed=null;return}
        b.disabled=true;
        try{const r=await apiPost({action:"delete",id:e.id,author:me(),pin});
          if(!r.ok){m.className="formmsg err";m.textContent=ERR[r.error]||"삭제하지 못했어요.";if(r.error==="not_found")await refresh();b.disabled=false;return}
          sstore("ms-pin",pin); m.className="formmsg"; m.textContent="삭제했어요."; if(editId===e.id)endEdit(); await refresh();
        }catch(err){m.className="formmsg err";m.textContent="연결이 끊겼어요. 다시 눌러 주세요.";b.disabled=false}});
      btns.appendChild(b); it.appendChild(btns)}
    box.appendChild(it)});
}
function renderMonth(){
  const y=view.getFullYear(),m=view.getMonth(),pre=`${y}-${pad(m+1)}-`;
  $("lh").textContent=`🗓️ ${m+1}월 전체 목록`;
  const list=entries.filter(e=>String(e.date).startsWith(pre)).sort((a,b)=>a.date.localeCompare(b.date)||MEALS.indexOf(a.meal)-MEALS.indexOf(b.meal));
  const tb=$("mList"); tb.textContent="";
  if(!list.length){const tr=el("tr");tr.appendChild(el("td",{colspan:"6",class:"memo"},"이번 달 변경이 아직 없어요."));tb.appendChild(tr);return}
  list.forEach(e=>{const tr=el("tr",{class:"click"});
    tr.appendChild(el("td",{},fmtDay(e.date))); tr.appendChild(el("td",{},e.meal));
    tr.appendChild(el("td",{class:"n "+cls(e)},sign(e))); tr.appendChild(el("td",{},e.dept));
    tr.appendChild(el("td",{class:"memo"},e.memo||"")); tr.appendChild(el("td",{},e.author||""));
    tr.addEventListener("click",()=>{sel=e.date;render();$("dh").scrollIntoView({block:"nearest"})});
    tb.appendChild(tr)});
}
function render(){renderCal();renderDay();renderMonth()}

/* ---- 수정 ---- */
function startEdit(e){
  editId=e.id; editOrig=e; dupKey="";
  $("fDate").min=e.date<today?e.date:today; $("fDate").value=e.date; $("fMeal").value=e.meal;
  (e.kind==="제외"?$("kCut"):$("kAdd")).checked=true; $("fCount").value=e.count; $("fDept").value=e.dept; $("fMemo").value=e.memo||"";
  $("fh").textContent="✏️ 수정 중 — 고친 뒤 [수정 저장]을 눌러 주세요"; $("fBtn").textContent="수정 저장"; $("fCancel").hidden=false;
  $("fMsg").className="formmsg"; $("fMsg").textContent=""; $("fh").scrollIntoView({block:"start",behavior:"smooth"});
}
function endEdit(){
  editId=null; editOrig=null; dupKey=""; $("fDate").min=today; if($("fDate").value<today)$("fDate").value=today;
  $("fh").textContent="✏️ 식수 변경 입력"; $("fBtn").textContent="일정표에 올리기"; $("fCancel").hidden=true;
  $("fCount").value=""; $("fMemo").value=""; $("fDept").value="";
}
$("fCancel").addEventListener("click",()=>{endEdit();$("fMsg").textContent="수정을 취소했어요."});

/* ---- 저장 ---- */
$("f").addEventListener("submit",async ev=>{
  ev.preventDefault(); const m=$("fMsg");
  const count=parseInt($("fCount").value,10), dept=$("fDept").value.trim(), date=$("fDate").value, author=me(), pin=$("fPin").value.trim();
  const kEl=document.querySelector('input[name="kind"]:checked'), meal=$("fMeal").value;
  if(!date||!meal||!kEl||!dept||!(count>0)||!author||!pin){m.className="formmsg err";m.textContent="메모를 빼고 모두 넣어 주세요. (날짜 · 식사 · 구분 · 인원 · 부서 · 작성자 · 비밀번호)";return}
  if(!/^\d{4}$/.test(pin)){m.className="formmsg err";m.textContent="비밀번호는 숫자 4자리예요.";$("fPin").focus();return}
  const kind=kEl.value;
  if(date<today&&!(editId&&editOrig&&date===editOrig.date)){m.className="formmsg err";m.textContent="지난 날짜는 입력할 수 없어요. 오늘 이후 날짜를 골라 주세요.";$("fDate").focus();return}
  const key=date+"|"+norm(dept), dups=entries.filter(e=>e.id!==editId&&e.date===date&&norm(e.dept)===norm(dept));
  if(dups.length&&dupKey!==key){dupKey=key;m.className="formmsg err";m.textContent=`⚠️ ${fmtDay(date)} ${dept} 내역이 이미 ${dups.length}건 있어요 (${dups.map(e=>e.meal+" "+sign(e)).join(", ")}). 그래도 올리려면 한 번 더 눌러 주세요.`;$("fBtn").textContent=editId?"그래도 수정 저장":"그래도 올리기";return}
  const entry={date,meal,kind,count,dept,memo:$("fMemo").value.trim()}, wasEdit=!!editId;
  $("fBtn").disabled=true; m.className="formmsg"; m.textContent="저장 중…";
  try{const r=await apiPost(wasEdit?{action:"update",id:editId,author,pin,entry}:{action:"add",author,pin,entry});
    if(!r.ok){m.className="formmsg err";m.textContent=ERR[r.error]||"저장하지 못했어요.";if(r.error==="pin")$("fPin").focus();if(r.error==="not_found")await refresh();dupKey="";$("fBtn").textContent=wasEdit?"수정 저장":"일정표에 올리기";return}
    store("ms-author",author); sstore("ms-pin",pin); endEdit();
    m.className="formmsg"; m.textContent=`${wasEdit?"수정했어요":"올렸어요"}: ${fmtDay(date)} ${meal} ${kind==="제외"?"−":"+"}${count}명 · ${dept}`;
    sel=date; const d=new Date(date+"T00:00:00"); view=new Date(d.getFullYear(),d.getMonth(),1); await refresh();
  }catch(err){m.className="formmsg err";m.textContent="연결이 끊겼어요. 다시 눌러 주세요."}
  finally{$("fBtn").disabled=false}
});
$("fAuthor").addEventListener("change",()=>{store("ms-author",me());render()});
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
$("todayBtn").onclick=()=>{view=new Date();view.setDate(1);sel=today;if(!editId)$("fDate").value=today;render()};

$("fDate").value=today; $("fDate").min=today; $("fPin").value=sload("ms-pin")||"";
const zs=load("ms-zoom"); if(zs)document.documentElement.style.setProperty("--z",zs);
const zget=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--z"))||1;
const zset=v=>{v=Math.min(1.8,Math.max(0.8,Math.round(v*10)/10));document.documentElement.style.setProperty("--z",v);store("ms-zoom",String(v))};
$("zIn").onclick=()=>zset(zget()+0.1); $("zOut").onclick=()=>zset(zget()-0.1);
render(); refresh();
setInterval(()=>{if(!document.hidden&&!editId)refresh()},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!editId)refresh()});
</script>
</body>
</html>
